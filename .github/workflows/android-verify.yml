name: Verify SNAIL Android sources

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: snail-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-unit-test:
    name: Compile Kotlin and run JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile app and run unit tests without packaging an APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest
